name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        dependencies: ["highest"]
        coverage: ["none"]
        include:
          - php: "8.1"
            dependencies: "lowest"
            coverage: "none"
          - php: "8.4"
            dependencies: "highest"
            coverage: "pcov"
        exclude:
          # Coverage runs on a dedicated 8.4 job.
          - php: "8.4"
            dependencies: "highest"
            coverage: "none"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage }}

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --prefer-dist --optimize-autoloader --prefer-lowest

      - name: Run test suite
        if: matrix.coverage == 'none'
        run: composer run-script test

      - name: Run coverage
        if: matrix.coverage == 'pcov'
        run: composer run-script coverage

      - name: Upload coverage results to Coveralls
        if: matrix.coverage == 'pcov'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: build/logs/clover.xml
          format: clover
